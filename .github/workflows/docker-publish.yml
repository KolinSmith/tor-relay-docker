name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'torrc'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
  schedule:
    # Every Monday 04:00 UTC — rebuild against the Tor Project apt repo so new
    # Tor releases (security releases land on a ~2-week cadence) are published
    # to :latest without a manual release. Does not cut a version tag.
    - cron: '0 4 * * 1'

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: nilok3/tor-relay-docker

jobs:
  # PRs: Build only (validate)
  # Push to master/main or tags: Build + Publish to ghcr.io and Docker Hub
  build-and-publish:
    name: ${{ github.event_name == 'pull_request' && 'Build (PR validation)' || 'Build and Publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only login for pushes to master/main or tags (not PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Newest `tor` in the Tor Project apt repo. Pinning the build to it lets us
      # tag and label the image with the Tor version it contains. Fails (rather
      # than publishing an unversioned image) if the lookup returns nothing.
      - name: Resolve Tor version from the apt repo
        id: tor
        run: |
          set -euo pipefail
          apt_version=$(curl -fsS --retry 3 \
            https://deb.torproject.org/torproject.org/dists/bookworm/main/binary-amd64/Packages \
            | awk '/^Package: tor$/{f=1} f&&/^Version:/&&!d{print $2; d=1}')
          if [ -z "$apt_version" ]; then
            echo "::error::Could not read the tor version from the Tor Project apt repo"
            exit 1
          fi
          tor_version=${apt_version%%-*}
          echo "apt_version=$apt_version" >> "$GITHUB_OUTPUT"
          echo "tor_version=$tor_version" >> "$GITHUB_OUTPUT"
          echo "apt repo has tor $apt_version"
          # The apt repo can lag a new release by a day or so. Warn, do not fail.
          upstream=$(curl -fsS --retry 3 https://dist.torproject.org/ \
            | grep -oE 'tor-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
            | sed -E 's/^tor-//; s/\.tar\.gz$//' | sort -V | tail -1 || true)
          if [ -n "$upstream" ] && [ "$upstream" != "$tor_version" ] \
             && [ "$(printf '%s\n%s\n' "$upstream" "$tor_version" | sort -V | tail -1)" = "$upstream" ]; then
            echo "::warning::Tor $upstream is released but the apt repo only has $tor_version"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=tor-${{ steps.tor.outputs.tor_version }},enable={{is_default_branch}}

      # Build for all events, but only push to registries on master/main/tags
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Unique per run so the Tor install layer always re-resolves against
          # the apt repo — the base image and earlier layers still come from cache.
          build-args: |
            TOR_APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            TOR_VERSION=${{ steps.tor.outputs.apt_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image published
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Image published to ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "✅ Image published to ${{ env.DOCKERHUB_IMAGE }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Git commit SHA: ${{ github.sha }}"

      - name: PR validation passed
        if: github.event_name == 'pull_request'
        run: echo "✅ Docker image builds successfully (not published)"
